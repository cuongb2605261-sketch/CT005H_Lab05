<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lợi ích của công nghệ số trong học tập</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f9ff; color: #0b2a4a; }
    header { background: #0b5ed7; color: #fff; padding: 32px 20px; text-align: center; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    img { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 8px; }
    .video { position: relative; padding-top: 56.25%; }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
    footer { text-align: center; font-size: 14px; color: #5a7391; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Lợi ích của công nghệ số trong học tập</h1>
    <p>Infographic và video ngắn giới thiệu cách công nghệ số hỗ trợ sinh viên học tập hiệu quả.</p>
  </header>
  <main>
    <section>
      <h2>Infographic</h2>
      <img src="Lab05_Ex2.1.png" alt="Infographic lợi ích của công nghệ số trong học tập">
    </section>
    <section>
      <h2>Video giới thiệu</h2>
      <div class="video">
        <iframe src="https://www.youtube.com/embed/tLbjNZGn1W0" title="Lợi ích của công nghệ số" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
    </section>
  </main>
  <footer>
    Ghi chú bản quyền: Mã nguồn HTML tạo với sự hỗ trợ của công cụ AI và đã được chỉnh sửa. Infographic và video do sinh viên thực hiện.
  </footer>
</body>
</html>
